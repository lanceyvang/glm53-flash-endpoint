name: Test and publish endpoint image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VLLM_COMMIT: 0b67266a0f37d6146a8403fb8482403c62f412d5
  B12X_COMMIT: 12aea7d96928f540a64259e4e24ef7688093b515
  B12X_TAG: 12aea7d
  IMAGE: ghcr.io/lanceyvang/glm53-flash-endpoint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VLLM_COMMIT }}-b12x-${{ env.B12X_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.VLLM_COMMIT }}
          build-args: |
            B12X_COMMIT=${{ env.B12X_COMMIT }}
