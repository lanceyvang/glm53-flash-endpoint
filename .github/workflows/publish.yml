name: Test and publish endpoint image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VLLM_COMMIT: 0b67266a0f37d6146a8403fb8482403c62f412d5
  IMAGE: ghcr.io/lanceyvang/glm53-flash-endpoint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk for the CUDA build
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: local-inference-lab/vllm
          ref: ${{ env.VLLM_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          path: vllm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./vllm
          file: ./vllm/docker/Dockerfile
          target: vllm-openai
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VLLM_COMMIT }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.VLLM_COMMIT }}
          build-args: |
            torch_cuda_arch_list=12.0
            max_jobs=2
            nvcc_threads=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make the endpoint image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /user/packages/container/glm53-flash-endpoint
          -f visibility=public
